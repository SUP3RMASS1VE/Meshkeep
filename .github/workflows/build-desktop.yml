name: Build desktop apps

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      make_release:
        description: Create a draft release with both installers
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac (Apple Silicon)
            runner: macos-15
            python-arch: arm64
            platform: macos-arm64
          - name: Windows (x64)
            runner: windows-2022
            python-arch: x64
            platform: windows-x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
          architecture: ${{ matrix.python-arch }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check release version
        run: python tools/ci_artifacts.py verify
      - name: Build and test Mac app
        if: runner.os == 'macOS'
        env:
          MME_BUILD_PYTHON: python3
        run: zsh build-mac.sh
      - name: Build and test Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build-windows.ps1 -Python python
      - name: Prepare installer and checksums
        env:
          MME_CI_PLATFORM: ${{ matrix.platform }}
        run: python tools/ci_artifacts.py collect
      - name: Upload installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Meshkeep-${{ matrix.platform }}
          path: build/release-upload/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
          overwrite: true

  draft-release:
    name: Prepare draft release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.make_release && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download both installers
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: Meshkeep-*
          merge-multiple: true
          path: build/release-upload
      - name: Verify both installers and combine checksums
        run: python3 tools/ci_artifacts.py combine
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="v$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          fi
          if gh release view "$RELEASE_TAG" --json isDraft,targetCommitish > build/release-state.json; then
            if [ "$(python3 -c 'import json; print(json.load(open("build/release-state.json"))["isDraft"])')" != "True" ]; then
              echo "Release $RELEASE_TAG is already published; leaving its assets unchanged." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            python3 -c 'import json,os; assert json.load(open("build/release-state.json"))["targetCommitish"] == os.environ["GITHUB_SHA"], "Existing draft targets a different commit; choose a new version."'
          else
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" \
              --title "Meshkeep $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" --clobber \
            build/release-upload/*.dmg \
            build/release-upload/*Setup.exe \
            build/release-upload/SHA256SUMS.txt
          echo "Draft release prepared: $RELEASE_TAG. Review it under Releases before publishing." >> "$GITHUB_STEP_SUMMARY"

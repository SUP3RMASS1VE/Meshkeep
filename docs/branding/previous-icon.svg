<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a7a"/>
      <stop offset="0.55" stop-color="#6a2fd1"/>
      <stop offset="1" stop-color="#14b8b0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9d2ff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9a8ff"/>
      <stop offset="1" stop-color="#7d63e6"/>
    </linearGradient>
    <linearGradient id="right" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fe7df"/>
      <stop offset="1" stop-color="#2aa9a3"/>
    </linearGradient>
    <linearGradient id="tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#120a40" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Tile: 824px squircle centered -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>

  <!-- Isometric cube, center (500,530), edge 230 -->
  <g filter="url(#soft)" stroke-linejoin="round">
    <polygon points="500,300 699,415 500,530 301,415" fill="url(#top)"/>
    <polygon points="301,415 500,530 500,760 301,645" fill="url(#left)"/>
    <polygon points="699,415 500,530 500,760 699,645" fill="url(#right)"/>
  </g>
  <!-- Wireframe mesh lines -->
  <g fill="none" stroke="#2b1a7a" stroke-opacity="0.35" stroke-width="7" stroke-linecap="round">
    <line x1="400" y1="357" x2="599" y2="472"/>
    <line x1="599" y1="357" x2="400" y2="472"/>
    <line x1="400" y1="472" x2="400" y2="702"/>
    <line x1="301" y1="530" x2="500" y2="645"/>
    <line x1="599" y1="472" x2="599" y2="702"/>
    <line x1="699" y1="530" x2="500" y2="645"/>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
    <polygon points="500,300 699,415 699,645 500,760 301,645 301,415"/>
    <polyline points="301,415 500,530 699,415"/>
    <line x1="500" y1="530" x2="500" y2="760"/>
  </g>

  <!-- Metadata tag overlapping lower-right corner -->
  <g transform="translate(640 640) rotate(-30)" filter="url(#soft)">
    <path d="M0,-62 L170,-62 Q200,-62 200,-32 L200,32 Q200,62 170,62 L0,62 L-58,0 Z" fill="url(#tag)"/>
    <circle cx="-14" cy="0" r="15" fill="#5a2bb8"/>
    <rect x="40" y="-22" width="120" height="14" rx="7" fill="#ffffff" fill-opacity="0.9"/>
    <rect x="40" y="10" width="80" height="14" rx="7" fill="#ffffff" fill-opacity="0.7"/>
  </g>
</svg>
